apply plugin: 'com.android.application'


android {
    namespace 'com.pizzaempire.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.pizzaempire.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// No dependencies: the game uses only the Android framework (Java + XML).
